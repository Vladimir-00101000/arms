upstream oauth2_proxy {
    server app-oauth2:4180;
    keepalive 32;
}

upstream api_backend {
    server app-api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name 10.5.122.180.nip.io;
    
    root /app/static;
    index index.html main.html;

    # ======================
    # ПУБЛИЧНЫЕ РЕСУРСЫ
    # ======================

    location /health {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 2s;
        proxy_send_timeout 2s;
        proxy_read_timeout 2s;
    }

    location /static/ {
        alias /app/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";
        
        error_page 404 = /static/404.html;
        error_page 403 = /static/403.html;
    }

    # ======================
    # OAuth2 ПРОКСИ
    # ======================

    location /oauth2/ {
        proxy_pass http://oauth2_proxy;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ======================
    # ПРОВЕРКА АУТЕНТИФИКАЦИИ
    # ======================

    location = /_oauth2_auth {
        internal;
        
        proxy_pass http://oauth2_proxy/oauth2/auth;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # ======================
    # API МАРШРУТЫ - ИСПРАВЛЕННАЯ ВЕРСИЯ
    # ======================

    location /api/ {
        auth_request /_oauth2_auth;
        
        # При ошибке 401 - редирект на логин
        error_page 401 = /oauth2/sign_in?rd=$scheme://$host$request_uri;
        
        # Получаем заголовки от OAuth2-Proxy
        # OAuth2-Proxy использует префикс X-Auth-Request-
        auth_request_set $x_user $upstream_http_x_auth_request_user;
        auth_request_set $x_user_id $upstream_http_x_auth_request_userid;
        auth_request_set $x_user_email $upstream_http_x_auth_request_email;
        auth_request_set $x_user_preferred_username $upstream_http_x_auth_request_preferred_username;
        auth_request_set $x_user_groups $upstream_http_x_auth_request_groups;
        
        # Проксируем в API
        proxy_pass http://api_backend;
        
        # ===== КРИТИЧЕСКИ ВАЖНО: передаем заголовки в том формате, который ожидает FastAPI =====
        # Ваш UserDependency ожидает lowercase заголовки:
        # x-user (external_id) - используем X-Auth-Request-User от OAuth2-Proxy
        # x-user-email - используем X-Auth-Request-Email от OAuth2-Proxy
        # x-user-name - используем X-Auth-Request-Preferred-Username от OAuth2-Proxy
        # x-user-surname - оставляем пустым или используем часть имени
        
        proxy_set_header x-user $x_user;  # external_id
        proxy_set_header x-user-id $x_user_id;  # user ID если есть
        proxy_set_header x-user-email $x_user_email;
        proxy_set_header x-user-name $x_user_preferred_username;
        proxy_set_header x-user-surname "";  # не передается OAuth2-Proxy, оставляем пустым
        
        # Также передаем оригинальные заголовки на случай, если нужны
        proxy_set_header X-Original-User $x_user;
        proxy_set_header X-Original-Email $x_user_email;
        
        # Стандартные заголовки
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Передаем куки от клиента
        proxy_set_header Cookie $http_cookie;
        
        # ===== ДЛЯ ОТЛАДКИ =====
        add_header X-Debug-Auth-User $x_user;
        add_header X-Debug-Auth-Email $x_user_email;
        add_header X-Debug-Auth-Name $x_user_preferred_username;
        add_header X-Debug-Auth-Status $upstream_status;
        
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 120s;
    }

    location /integration/ {
    # БЕЗ auth_request - пропускаем проверку OAuth2
    
    proxy_pass http://api_backend;
    
    # # Устанавливаем дефолтные заголовки или заголовки для интеграции
    # proxy_set_header x-user "integration-service";
    # proxy_set_header x-user-email "integration@example.com";
    # proxy_set_header x-user-name "Integration";
    # proxy_set_header x-user-surname "Service";
    
    # proxy_set_header X-Original-User "integration-service";
    # proxy_set_header X-Original-Email "integration@example.com";
    # proxy_set_header Host $host;
    # proxy_set_header X-Real-IP $remote_addr;
    # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # proxy_set_header X-Forwarded-Proto $scheme;
    # proxy_set_header Cookie $http_cookie;
    
    proxy_connect_timeout 30s;
    proxy_send_timeout 30s;
    proxy_read_timeout 120s;
    }

    # ======================
    # ГЛАВНАЯ СТРАНИЦА
    # ======================

    location = / {
        auth_request /_oauth2_auth;
        error_page 401 = @not_authenticated;
        
        root /app/static;
        try_files /index.html =404;
        
        # Получаем информацию о пользователе для передачи во frontend
        auth_request_set $x_user $upstream_http_x_auth_request_user;
        auth_request_set $x_user_email $upstream_http_x_auth_request_email;
        auth_request_set $x_user_name $upstream_http_x_auth_request_preferred_username;
        
        # Передаем информацию о пользователе во frontend через заголовки
        add_header X-Auth-User $x_user;
        add_header X-Auth-Email $x_user_email;
        add_header X-Auth-Name $x_user_name;
        
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";
    }

    location @not_authenticated {
        root /app/static;
        try_files /main.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Auth-Status "not-authenticated";
    }

    location = /main.html {
        root /app/static;
        try_files /main.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ======================
    # ОБРАБОТКА ОШИБОК
    # ======================

    error_page 404 /static/404.html;
    error_page 500 502 503 504 /static/50x.html;
    
    # ======================
    # БЕЗОПАСНОСТЬ
    # ======================

    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    
    server_tokens off;
}